name: Build and release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_RUN_ID: ${{ github.run_id }}
      RELEASE_SOURCE_SHA: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      - name: Prepare release version
        id: version
        run: ./tools/Release/Prepare-Release.ps1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check installer and OCR prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          $ocr = Get-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0'
          if ($ocr.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name 'Language.OCR~~~en-US~0.0.1.0' -ErrorAction Stop
          }

      - name: Build installer and run checks
        run: ./Publish-Installer.ps1

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/Release/Publish-Release.ps1

      - name: Retain check results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/single-exe-checks/**/results/*
          if-no-files-found: ignore
          retention-days: 14

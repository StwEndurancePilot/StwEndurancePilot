name: Discord Worker

on:
  pull_request:
    paths: ['discord-worker/**', '.github/workflows/discord-worker.yml']
  push:
    paths: ['discord-worker/**', '.github/workflows/discord-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discord-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: discord-worker/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npx wrangler deploy --dry-run

  deploy:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: discord-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-worker
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Deploy dedicated Worker with runtime configuration
        run: node scripts/deploy.js
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.DISCORD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.DISCORD_CLOUDFLARE_ACCOUNT_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          PUBLIC_ORIGIN: ${{ secrets.DISCORD_WORKER_ORIGIN }}
      - name: Register Discord commands
        run: node scripts/register-commands.js
        env:
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
